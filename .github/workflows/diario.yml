name: Resumen diario MEF

permissions:
  contents: write

on:
  schedule:
    - cron: '0 10 * * *'   # 10:00 UTC = 5:00am hora Perú (UTC-5)
  workflow_dispatch:        # te permite además correrlo manualmente cuando quieras

jobs:
  ejecutar-resumen:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar script
        run: python scripts/resumen_energia.py

      - name: Guardar resultado como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: resumen-energia-minas
          path: energia_minas_resumen.csv

      - name: Guardar resultado en el repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p output
          cp energia_minas_resumen.csv output/energia_minas_resumen.csv
          git add output/energia_minas_resumen.csv
          git commit -m "Actualiza resumen diario" || echo "Sin cambios"
          git push
